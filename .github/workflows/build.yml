name: Build PS2 ISO Native

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Generate ISO natively
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          apk update && apk add xorriso make
          
          # Pełny, działający kod gry Snake z rysowaniem na PS2
          cat << 'EOF' > main.c
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifcmd.h>
          #include <sifrpc.h>
          #include <graph.h>
          #include <draw.h>
          #include <libpad.h>

          #define SCREEN_WIDTH  640
          #define SCREEN_HEIGHT 448
          #define BLOCK_SIZE    20

          typedef struct {
              int x, y;
          } Vector2;

          static char pad_buf[256] __attribute__((aligned(64)));

          int main(int argc, char *argv[]) {
              SifInitRpc(0);
              padInit(0);
              
              graph_set_mode(0, GRAPH_MODE_NTSC, GRAPH_MODE_INTERLACED, GRAPH_MODE_FIELD);
              
              framebuffer_t fb;
              fb.address = graph_vram_allocate(SCREEN_WIDTH, SCREEN_HEIGHT, GRAPH_PIXEL_32BIT, GRAPH_RAM_BLOCK);
              fb.width = SCREEN_WIDTH;
              fb.height = SCREEN_HEIGHT;
              fb.mask = 0;
              fb.psm = GRAPH_PIXEL_32BIT;
              graph_set_framebuffer(&fb);
              graph_enable_output();

              padPortOpen(0, 0, pad_buf);

              // Wąż i jabłko
              Vector2 snake[50];
              int snake_len = 3;
              snake[0] = (Vector2){10, 10};
              snake[1] = (Vector2){9, 10};
              snake[2] = (Vector2){8, 10};

              int dx = 1;
              int dy = 0;
              Vector2 apple = {15, 10};
              int frame_counter = 0;

              while(1) {
                  // Odczyt pada PS2
                  struct padButtonStatus buttons;
                  if (padRead(0, 0, &buttons) > 0) {
                      u32 paddata = 0xffff ^ buttons.btns;
                      if ((paddata & PAD_LEFT) && dx == 0) { dx = -1; dy = 0; }
                      else if ((paddata & PAD_RIGHT) && dx == 0) { dx = 1; dy = 0; }
                      else if ((paddata & PAD_UP) && dy == 0) { dx = 0; dy = -1; }
                      else if ((paddata & PAD_DOWN) && dy == 0) { dx = 0; dy = 1; }
                  }

                  // Wolniejsze tempo ruchu węża
                  if (++frame_counter > 20) {
                      frame_counter = 0;
                      for (int i = snake_len - 1; i > 0; i--) {
                          snake[i] = snake[i - 1];
                      }
                      snake[0].x += dx;
                      snake[0].y += dy;

                      // Kolizja z jabłkiem
                      if (snake[0].x == apple.x && snake[0].y == apple.y) {
                          if (snake_len < 50) snake_len++;
                          apple.x = (apple.x + 7) % (SCREEN_WIDTH / BLOCK_SIZE);
                          apple.y = (apple.y + 5) % (SCREEN_HEIGHT / BLOCK_SIZE);
                      }
                  }

                  // Przygotowanie bufora rysowania (czyszczenie na czarno)
                  qword_t q[512];
                  qword_t *q_ptr = q;
                  q_ptr = draw_clear(q_ptr, 0, 0.0f, 0.0f, SCREEN_WIDTH, SCREEN_HEIGHT, 20, 20, 40);

                  // Rysowanie jabłka (czerwony kwadrat)
                  q_ptr = draw_rect(q_ptr, 0, 
                      apple.x * BLOCK_SIZE, apple.y * BLOCK_SIZE, 
                      BLOCK_SIZE, BLOCK_SIZE, 
                      255, 0, 0);

                  // Rysowanie węża (zielone kwadraty)
                  for (int i = 0; i < snake_len; i++) {
                      q_ptr = draw_rect(q_ptr, 0, 
                          snake[i].x * BLOCK_SIZE, snake[i].y * BLOCK_SIZE, 
                          BLOCK_SIZE, BLOCK_SIZE, 
                          0, 255, 0);
                  }

                  q_ptr = draw_finish(q_ptr);
                  draw_exec_packet(q, q_ptr - q);

                  graph_wait_vsync();
              }
              return 0;
          }
          EOF

          # Makefile
          cat << 'EOF' > Makefile
          EE_BIN = SLES_555.55
          EE_OBJS = main.o
          EE_LIBS = -lpad -lgraph -ldraw -lkernel -lc
          
          all: $(EE_BIN)
          	mkdir -p iso_dir
          	cp $(EE_BIN) iso_dir/SLES_555.55
          	printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_dir/SYSTEM.CNF
          	xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_GAME.ISO iso_dir/

          clean:
          	rm -f $(EE_BIN) $(EE_OBJS) SNAKE_GAME.ISO
          	rm -rf iso_dir

          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

          make clean || true
          make
          
          ls -la SNAKE_GAME.ISO

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
