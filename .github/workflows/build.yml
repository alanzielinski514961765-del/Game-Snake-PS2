name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build essentials and wget
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget git patch gzip bzip2 tar make

      - name: Quick compile check
        run: |
          # Sprawdzamy czy make działa w standardowym środowisku Ubuntu
          make --version
          
      - name: Compile project
        run: |
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
