name: Build PS2 Native ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps2-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu źródłowego
        uses: actions/checkout@v4

      - name: Instalacja zależności systemowych
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget git make xorriso libarchive-tools curl

      - name: Pobieranie gotowego Toolchaina PS2 (Gotowe binaria)
        run: |
          echo "Pobieram oficjalne binaria ps2dev..."
          sudo mkdir -p /usr/local/ps2dev
          
          # Pobieramy stabilny, gotowy pakiet toolchaina dla Ubuntu z oficjalnych wydań ps2dev
          wget https://github.com/ps2dev/ps2toolchain/releases/download/v1.0/ps2dev-ubuntu-latest.tar.gz -O /tmp/ps2dev.tar.gz || true
          
          if [ -f /tmp/ps2dev.tar.gz ] && [ -s /tmp/ps2dev.tar.gz ]; then
              sudo tar -xzf /tmp/ps2dev.tar.gz -C /usr/local/ps2dev --strip-components=1
          else
              echo "Pobieranie paczki nie powiodło się, pobieram minimalny gotowy pakiet kompilatora..."
              # Alternatywny, bezpośredni download spakowanego środowiska ee
              sudo curl -L https://github.com/ps2dev/ps2sdk/releases/download/v1.0/ps2sdk.tar.gz -o /tmp/ps2sdk.tar.gz || true
          fi

          # Ustawiamy zmienne środowiskowe GitHub Actions dla kolejnych kroków
          echo "PS2DEV=/usr/local/ps2dev" >> $GITHUB_ENV
          echo "PS2SDK=/usr/local/ps2dev/ps2sdk" >> $GITHUB_ENV
          echo "/usr/local/ps2dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps2dev/ee/bin" >> $GITHUB_PATH

      - name: Kompilacja kodu i budowa ISO
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PATH

          echo "Sprawdzam dostępność kompilatora:"
          which ee-gcc || find / -name "ee-gcc"

          echo "Kompilowanie projektu za pomocą Make..."
          make

          echo "Tworzenie struktury ISO dla PS2..."
          mkdir -p iso_root
          cp SLES_555.55 iso_root/SLES_555.55
          
          printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_root/SYSTEM.CNF

          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_PS2.ISO iso_root/
          ls -lh SNAKE_PS2.ISO

      - name: Wrzuć gotowe ISO jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PS2.ISO
          path: SNAKE_PS2.ISO
          
