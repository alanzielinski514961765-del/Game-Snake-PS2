name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile project
        shell: bash
        run: |
          source /etc/profile.d/ps2dev.sh || export PS2DEV=/usr/local/ps2dev && export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
