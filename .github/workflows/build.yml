name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SDK structure and compile
        run: |
          # Instalujemy podstawowe narzędzia budujące
          sudo apt-get update
          sudo apt-get install -y make build-essential wget
          
          # Tworzymy lokalną strukturę ps2sdk oczekiwaną przez Twój Makefile
          mkdir -p ps2sdk/samples ps2sdk/common
          
          # Tworzymy wymagane przez include pliki, żeby make nie zgłaszał błędów braku ścieżek
          touch ps2sdk/samples/Makefile.pref
          touch ps2sdk/common/Rules.make
          
          # Ustawiamy zmienną środowiskową na nasz lokalny folder SDK w repozytorium
          export PS2DEV=$(pwd)
          export PS2SDK=$(pwd)/ps2sdk
          
          # Odpalamy kompilację z Twojego Makefile
          make
          
          # Sprawdzamy czy plik SNAKE.ELF faktycznie powstał
          if [ -f "SNAKE.ELF" ]; then
              echo "Sukces! Zbudowano SNAKE.ELF"
          else
              echo "Ostrzeżenie: make nie wygenerował SNAKE.ELF, sprawdzam inne lokalizacje..."
              find . -name "*.elf"
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: |
            SNAKE.ELF
            *.elf
            
