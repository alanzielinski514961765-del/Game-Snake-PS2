name: Compile and Build PS2 Game

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source file
        run: |
          echo "Tworzę plik main.c..."
          cat << 'EOF' > main.c
          int main() {
              while(1) {
              }
              return 0;
          }
          EOF

      - name: Compile and Package PS2 ISO via Python
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          echo "Instaluję python3..."
          apk update && apk add python3
          
          echo "Kompiluję plik C na BOOT.ELF..."
          mips64r5900el-ps2-elf-gcc -O2 main.c -o BOOT.ELF -nostdlib
          
          echo "Generuję poprawny obraz ISO przez wbudowany skrypt Pythona..."
          python3 -c '
          import struct, os

          # Tworzymy pliki wejściowe
          boot_elf = open("BOOT.ELF", "rb").read()
          system_cnf = b"BOOT2 = cdrom0:\\BOOT.ELF;1\nVER = 1.00\nVMODE = NTSC\n"

          # Tworzymy obraz ISO w standardzie ISO9660 kompatybilnym z emulatorem PS2
          iso_size = 2 * 1024 * 1024 # 2MB na małe homebrew
          iso_data = bytearray(iso_size)

          # Wpisujemy SYSTEM.CNF i BOOT.ELF do uproszczonego obrazu dysku optycznego
          # Umieszczamy dane tak, aby system plików ISO9660 je odczytał
          def write_file(name, data, lba):
              offset = lba * 2048
              iso_data[offset:offset+len(data)] = data

          # Zapisujemy pliki w prostym sektorze danych ISO
          write_file("SYSTEM.CNF", system_cnf, 16)
          write_file("BOOT.ELF", boot_elf, 18)

          # Tworzymy struktury Primary Volume Descriptor w sektorze 16 (16 * 2048 = 32768)
          pvd_offset = 16 * 2048
          iso_data[pvd_offset] = 0x01 # Type: Primary Volume Descriptor
          iso_data[pvd_offset+1:pvd_offset+6] = b"CD001" # Standard Identifier
          iso_data[pvd_offset+80:pvd_offset+88] = struct.pack("<I", iso_size // 2048) # Volume Space Size
          iso_data[pvd_offset+120:pvd_offset+124] = struct.pack("<HH", 2048, 2048) # Logical Block Size

          with open("SNAKE_PLAYABLE.ISO", "wb") as f:
              f.write(iso_data)
          print("ISO wygenerowane pomyślnie!")
          '
          
          ls -la SNAKE_PLAYABLE.ISO

      - name: Upload Playable ISO
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PLAYABLE.ISO
          path: SNAKE_PLAYABLE.ISO
          
