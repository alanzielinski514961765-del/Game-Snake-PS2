name: Build PS2 ISO Native

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Generate ISO natively
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          apk update && apk add xorriso make
          
          # Kod źródłowy gry Wąż (Snake) dla PlayStation 2
          cat << 'EOF' > main.c
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifcmd.h>
          #include <graph.h>
          #include <draw.h>
          
          // Prosta struktura węża i punktacji do testu
          typedef struct {
              int x, y;
          } Point;

          int main(int argc, char *argv[]) {
              // Inicjalizacja podstawowych systemów konsoli
              SifInitRpc(0);
              
              Point snake = {32, 32};
              Point apple = {16, 16};
              int score = 0;

              // Główna pętla gry
              while(1) {
                  // Tutaj w przyszłości dojdzie odczyt padów (PAD_PORT0)
                  // Na razie symulujemy logikę i zbieranie punktów
                  
                  // Prosty test kolizji z jabłkiem
                  if (snake.x == apple.x && snake.y == apple.y) {
                      score += 10;
                      // Nowa losowa pozycja jabłka uproszczona
                      apple.x = (score * 5) % 50;
                      apple.y = (score * 3) % 40;
                  }

                  // Synchronizacja ramki / delikatne opóźnienie
                  for(volatile int i = 0; i < 500000; i++);
              }
              return 0;
          }
          EOF

          # Tworzymy Makefile z poprawnymi regułami PS2SDK
          cat << 'EOF' > Makefile
          EE_BIN = SLES_555.55
          EE_OBJS = main.o
          EE_LIBS = -lc
          
          all: $(EE_BIN)
          	mkdir -p iso_dir
          	cp $(EE_BIN) iso_dir/SLES_555.55
          	printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_dir/SYSTEM.CNF
          	xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_GAME.ISO iso_dir/

          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

          # Kompilacja projektu
          make clean || true
          make
          
          ls -la SNAKE_GAME.ISO

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
