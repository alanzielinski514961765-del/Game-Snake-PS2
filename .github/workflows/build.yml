      - name: Compile and Package PS2 ISO
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          echo "Instaluję xorriso..."
          apk update && apk add xorriso
          
          echo "Kompiluję plik ELF..."
          mips64r5900el-ps2-elf-gcc -O2 main.c -o BOOT.ELF -nostdlib -Wl,-Ttext,0x198000
          
          echo "Tworzę strukturę katalogów ISO..."
          mkdir -p iso_root
          cp BOOT.ELF iso_root/BOOT.ELF
          
          printf "BOOT2 = cdrom0:\\BOOT.ELF;1\r\nVER = 1.00\r\nVMODE = NTSC\r\n" > iso_root/SYSTEM.CNF
          
          echo "Generuję obraz ISO za pomocą xorriso..."
          xorriso -as mkisofs -iso-level 1 -o SNAKE_PLAYABLE.ISO -V "SNAKE_GAME" -joliet off -rock off iso_root/
          
          ls -la SNAKE_PLAYABLE.ISO
          
