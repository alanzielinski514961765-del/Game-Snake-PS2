name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PS2 Toolchain & Build
        run: |
          # Instalujemy zależności systemowe wymagane do kompilacji toolchaina
          sudo apt-get update && sudo apt-get install -y build-essential git wget cmake libgmp3-dev libmpc-dev libmpfr-dev texinfo bison flex
          
          # Klonujemy oficjalne repozytorium ps2dev
          git clone --depth 1 https://github.com/ps2dev/ps2dev.git /tmp/ps2dev
          cd /tmp/ps2dev
          
          # Ustawiamy zmienną docelową
          export PS2DEV=/usr/local/ps2dev
          export PATH=$PATH:$PS2DEV/bin
          
          # Uruchamiamy instalację toolchaina i ps2sdk (skrypty w repozytorium)
          ./toolchain.sh
          ./ps2sdk.sh
          
          # Wracamy do projektu i kompilujemy grę
          cd $GITHUB_WORKSPACE
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
