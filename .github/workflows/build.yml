name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and Compile with ee-gcc
        run: |
          # Ten skrypt sam znajduje ścieżkę do ee-gcc w kontenerze
          EE_GCC_PATH=$(find / -name "ee-gcc" -type f 2>/dev/null | head -n 1)
          echo "Znaleziono ee-gcc w: $EE_GCC_PATH"
          
          BIN_DIR=$(dirname "$EE_GCC_PATH")
          export PATH=$PATH:$BIN_DIR
          
          ee-gcc --version
          
          # Kompilacja projektu
          if [ -d "src" ]; then
              ee-gcc -O2 src/*.c -o SNAKE.ELF -lgraph -lkernel
          else
              ee-gcc -O2 *.c -o SNAKE.ELF -lgraph -lkernel
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
