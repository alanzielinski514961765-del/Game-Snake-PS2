name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download precompiled PS2DEV SDK
        run: |
          # Pobieramy oficjalne, gotowe archiwum ps2dev bezpośrednio z releasów
          wget https://github.com/ps2dev/ps2toolchain/releases/latest/download/ps2dev-ubuntu-latest.tar.gz -O /tmp/ps2dev.tar.gz || \
          wget https://github.com/ps2dev/ps2releases/releases/latest/download/ps2dev-ubuntu-latest.tar.gz -O /tmp/ps2dev.tar.gz
          
          sudo mkdir -p /usr/local/ps2dev
          sudo tar -xzf /tmp/ps2dev.tar.gz -C /usr/local/ps2dev

      - name: Compile project
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
