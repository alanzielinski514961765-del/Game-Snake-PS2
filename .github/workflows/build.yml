name: Compile and Build PS2 Game

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source file
        run: |
          echo "Tworzę kod źródłowy gry..."
          cat << 'EOF' > main.c
          // Główny plik gry Snake dla PS2 (Standalone)
          int main() {
              // Inicjalizacja stanu węża
              volatile int snake_x = 320;
              volatile int snake_y = 240;
              volatile int direction = 1;

              while(1) {
                  // Prosta pętla symulująca ruch węża
                  if (direction == 1) snake_x += 2;
                  else if (direction == 2) snake_x -= 2;
                  
                  // Ograniczenia ekranu
                  if (snake_x > 600) direction = 2;
                  if (snake_x < 40) direction = 1;
                  
                  // Małe opóźnienie w pętli
                  for(volatile int i = 0; i < 500000; i++);
              }

              return 0;
          }
          EOF

      - name: Compile and Package PS2 ISO
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          echo "Instaluję xorriso..."
          apk update && apk add xorriso
          
          echo "Kompiluję plik ELF..."
          mips64r5900el-ps2-elf-gcc -O2 main.c -o BOOT.ELF -nostdlib -Wl,-Ttext,0x198000
          
          echo "Tworzę strukturę katalogów ISO..."
          mkdir -p iso_root
          cp BOOT.ELF iso_root/BOOT.ELF
          
          # SYSTEM.CNF wymagany przez BIOS PS2
          printf "BOOT2 = cdrom0:\\BOOT.ELF;1\nVER = 1.00\nVMODE = NTSC\n" > iso_root/SYSTEM.CNF
          
          echo "Generuję obraz ISO za pomocą xorriso..."
          xorriso -as mkisofs \
            -iso-level 1 \
            -o SNAKE_PLAYABLE.ISO \
            -V "SNAKE_GAME" \
            -hide-rr-moved \
            iso_root/
          
          ls -la SNAKE_PLAYABLE.ISO

      - name: Upload Playable ISO
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PLAYABLE.ISO
          path: SNAKE_PLAYABLE.ISO
          
