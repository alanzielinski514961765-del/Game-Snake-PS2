name: Compile and Build PS2 Game

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source file
        run: |
          echo "Tworzę czysty plik main.c..."
          cat << 'EOF' > main.c
          // Czysty plik bez felernych nagłówków SIF – tylko podstawowy kernel
          int main() {
              int snake_x = 10;
              int snake_y = 10;

              while(1) {
                  snake_x++;
                  if (snake_x > 100) {
                      snake_x = 10;
                  }
              }

              return 0;
          }
          EOF

      - name: Compile and Package PS2 ISO via xorriso
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          echo "Instaluję xorriso..."
          apk update && apk add xorriso
          
          echo "Kompiluję kod C bez zewnętrznych bibliotek I Wsadzam Penisa W Plastikową Cipę..."
          mips64r5900el-ps2-elf-gcc -O2 main.c -o BOOT.ELF -nostdlib
          
          mkdir -p iso_root
          cp BOOT.ELF iso_root/BOOT.ELF
          printf "BOOT2 = cdrom0:\\BOOT.ELF;1\nVER = 1.00\nVMODE = NTSC\n" > iso_root/SYSTEM.CNF
          
          xorriso -as mkisofs -iso-level 1 -o SNAKE_PLAYABLE.ISO iso_root/
          ls -la SNAKE_PLAYABLE.ISO

      - name: Upload Playable ISO
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PLAYABLE.ISO
          path: SNAKE_PLAYABLE.ISO
          
