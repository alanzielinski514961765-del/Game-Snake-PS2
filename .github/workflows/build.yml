name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile with PS2dev
        run: |
          # Szukamy ee-gcc tylko w katalogach systemowych (omijając /__w)
          EE_GCC_PATH=$(find /usr/local /opt -name "ee-gcc" -type f 2>/dev/null | head -n 1)
          
          if [ -z "$EE_GCC_PATH" ]; then
              echo "Nie znaleziono w /usr /opt, szukam wszędzie oprócz katalogu roboczego..."
              EE_GCC_PATH=$(find / -name "ee-gcc" -type f 2>/dev/null | grep -v "/__w" | head -n 1)
          fi
          
          echo "Znaleziono ee-gcc w: $EE_GCC_PATH"
          BIN_DIR=$(dirname "$EE_GCC_PATH")
          
          export PATH=$PATH:$BIN_DIR
          export PS2DEV=$(dirname $(dirname "$BIN_DIR"))
          export PS2SDK=$PS2DEV/ps2sdk
          
          ee-gcc --version
          
          # Kompilacja projektu
          if [ -d "src" ]; then
              ee-gcc -O2 src/*.c -o SNAKE.ELF -L$PS2SDK/ee/lib -I$PS2SDK/ee/include -lgraph -lkernel
          else
              ee-gcc -O2 *.c -o SNAKE.ELF -L$PS2SDK/ee/lib -I$PS2SDK/ee/include -lgraph -lkernel
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
