name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget libarchive-tools genisoimage make autoconf automake libreadline-dev libssl-dev zlib1g-dev libgmp3-dev libmpfr-dev
          
          git clone --depth 1 https://github.com/ps2dev/ps2toolchain.git /tmp/ps2toolchain
          cd /tmp/ps2toolchain
          ./toolchain.sh

      - name: Compile project
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
