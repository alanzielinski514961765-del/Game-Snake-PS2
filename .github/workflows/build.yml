name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Find ee-gcc location
        run: |
          echo "Szukam pliku ee-gcc w całym systemie:"
          find / -name "ee-gcc" 2>/dev/null || true
          
          echo "Zawartość /usr/local:"
          ls -la /usr/local || true
          
          echo "Zmienne środowiskowe:"
          env

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
