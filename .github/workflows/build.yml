name: Build PS2 ISO Native

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Generate ISO natively
        run: |
          apk update && apk add xorriso

          cat << 'EOF' > main.c
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifcmd.h>
          #include <sifrpc.h>
          #include <graph.h>
          #include <libpad.h>

          int main(int argc, char *argv[]) {
              SifInitRpc(0);
              padInit(0);
              graph_set_mode(0, GRAPH_MODE_NTSC, GRAPH_MODE_INTERLACED, GRAPH_MODE_FIELD);
              while(1) { graph_wait_vsync(); }
              return 0;
          }
          EOF

          /usr/local/ps2dev/bin/ee-gcc -O2 main.c -o SLES_555.55 -L/usr/local/ps2dev/ps2sdk/ee/lib -lpad -lgraph -ldraw -lkernel -lc
          
          mkdir -p iso_dir
          cp SLES_555.55 iso_dir/SLES_555.55
          printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_dir/SYSTEM.CNF
          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_GAME.ISO iso_dir/
          ls -la SNAKE_GAME.ISO

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
