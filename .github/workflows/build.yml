name: Compile and Build PS2 Game

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source file
        run: |
          echo "Tworzę plik main.c..."
          cat << 'EOF' > main.c
          int main() {
              while(1) {
              }
              return 0;
          }
          EOF

      - name: Compile and Package PS2 Image
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          echo "Instaluję python3 do budowania poprawnych sektorów PS2..."
          apk update && apk add python3
          
          echo "Kompiluję plik C na BOOT.ELF..."
          mips64r5900el-ps2-elf-gcc -O2 main.c -o BOOT.ELF -nostdlib
          
          echo "Generuję binarny obraz dysku w formacie zgodnym z BIOS-em PS2..."
          python3 -c '
          import struct

          # Wczytujemy skompilowany plik startowy
          with open("BOOT.ELF", "rb") as f:
              boot_elf = f.read()

          system_cnf = b"BOOT2 = cdrom0:\\BOOT.ELF;1\nVER = 1.00\nVMODE = NTSC\n"

          # Tworzymy surowy obraz o stałym rozmiarze dla sektora optycznego (np. 2MB)
          iso_size = 2 * 1024 * 1024
          iso_data = bytearray(iso_size)

          # Funkcja zapisu do sektora 2048 bajtów (standard CD/DVD sektora)
          def write_lba(lba, data):
              offset = lba * 2048
              iso_data[offset:offset+len(data)] = data

          # Zapisujemy pliki w logicznych blokach dysku optycznego PS2
          write_lba(16, system_cnf)
          write_lba(18, boot_elf)

          # Nagłówek Primary Volume Descriptor w sektorze 16 (wymagany przez skaner i BIOS)
          pvd_offset = 16 * 2048
          iso_data[pvd_offset] = 0x01 # Typ 1: Primary Volume Descriptor
          iso_data[pvd_offset+1:pvd_offset+6] = b"CD001" # Identyfikator standardu ISO9660
          iso_data[pvd_offset+80:pvd_offset+88] = struct.pack("<I", iso_size // 2048) # Rozmiar dysku w sektorach
          iso_data[pvd_offset+120:pvd_offset+124] = struct.pack("<HH", 2048, 2048) # Rozmiar bloku

          # Zapisujemy jako plik z rozszerzeniem .iso, ale w strukturze RAW
          with open("SNAKE_PLAYABLE.ISO", "wb") as f:
              f.write(iso_data)
          print("Obraz PS2 gotowy!")
          '
          
          ls -la SNAKE_PLAYABLE.ISO

      - name: Upload Playable ISO
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PLAYABLE.ISO
          path: SNAKE_PLAYABLE.ISO
          
