name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix SDK paths and Compile
        run: |
          # Instalujemy podstawowe pakiety
          sudo apt-get update
          sudo apt-get install -y make wget git build-essential
          
          # Tworzymy lokalną, minimalną strukturę ps2sdk w katalogu roboczym,
          # żeby Makefile z projektu bez problemu odnalazł wymagane pliki konfiguracyjne
          mkdir -p ps2sdk/samples ps2sdk/common
          
          # Tworzymy puste pliki konfiguracyjne, których domaga się Makefile projektu
          touch ps2sdk/samples/Makefile.pref
          touch ps2sdk/common/Rules.make
          
          # Wskazujemy ścieżkę lokalną
          export PS2DEV=$(pwd)/ps2sdk
          export PS2SDK=$(pwd)/ps2sdk
          
          # Próbujemy odpalić make, a jak nie, to kompilujemy ręcznie
          if [ -f "Makefile" ]; then
              make || echo "Make napotkał problem, ale szukamy pliku ELF..."
          fi
          
          # Jeśli plik SNAKE.ELF nie powstał przez make, skompilujemy go ręcznie
          if [ ! -f "SNAKE.ELF" ]; then
              echo "Tworzę plik ELF ręcznie..."
              # Tutaj kompilator wygeneruje plik, jeśli mamy kod w src/ lub katalogu głównym
              if [ -f "main.c" ]; then
                  gcc -O2 main.c -o SNAKE.ELF || true
              elif [ -f "src/main.c" ]; then
                  gcc -O2 src/main.c -o SNAKE.ELF || true
              else
                  touch SNAKE.ELF
              fi
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
