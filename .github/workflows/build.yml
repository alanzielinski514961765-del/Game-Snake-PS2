name: Build PS2 ISO Native

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Kompilacja w kontenerze ps2dev
        run: |
          # Jawne ustawienie ścieżek dla tego kroku
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PATH

          echo "Sprawdzanie dostępności ee-gcc:"
          which ee-gcc || find / -name "ee-gcc" 2>/dev/null

          # Kompilacja właściwa
          ee-gcc -O2 main.c -o SLES_555.55 \
            -I$PS2SDK/ee/include \
            -I$PS2SDK/common/include \
            -L$PS2SDK/ee/lib \
            -lpad -lgraph -ldraw -lkernel -lc

          # Pakowanie do ISO
          apt-get update && apt-get install -y xorriso
          mkdir -p iso_dir
          cp SLES_555.55 iso_dir/SLES_555.55
          printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_dir/SYSTEM.CNF
          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_GAME.ISO iso_dir/

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
