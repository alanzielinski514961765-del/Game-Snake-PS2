name: Build PS2 Native ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps2-iso:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Pobranie kodu źródłowego
        uses: actions/checkout@v4

      - name: Kompilacja kodu i budowa ISO w kontenerze
        run: |
          # Kontener ps2dev ma już ustawione zmienne PS2DEV, PS2SDK oraz ścieżki w PATH!
          echo "Sprawdzanie kompilatora w kontenerze:"
          which ee-gcc
          ee-gcc --version

          echo "Kompilowanie projektu za pomocą Make..."
          make

          echo "Tworzenie struktury ISO dla PS2..."
          mkdir -p iso_root
          cp SLES_555.55 iso_root/SLES_555.55
          
          # Plik konfiguracyjny startowy dla PS2 / emulatorów
          printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_root/SYSTEM.CNF

          # Instalacja xorriso w kontenerze i generowanie ISO
          apt-get update && apt-get install -y xorriso
          
          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_PS2.ISO iso_root/
          ls -lh SNAKE_PS2.ISO

      - name: Wrzuć gotowe ISO jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PS2.ISO
          path: SNAKE_PS2.ISO
          
