name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PS2dev and Compile
        run: |
          # Instalujemy niezbędne pakiety
          sudo apt-get update
          sudo apt-get install -y make wget git build-essential patch zlib1g-dev libgmp-dev libmpfr-dev libmpc-dev
          
          # Klonujemy ps2dev do /tmp
          git clone --depth 1 https://github.com/ps2dev/ps2dev.git /tmp/ps2dev
          
          # Konfigurujemy zmienne środowiskowe dla ps2dev
          export PS2DEV=/tmp/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          # Jeśli projekt używa make, ustawiamy brakujące ścieżki i budujemy
          export PS2RULE=$PS2DEV
          
          if [ -f "Makefile" ]; then
              make
          else
              ee-gcc -O2 *.c -o SNAKE.ELF -L$PS2SDK/ee/lib -I$PS2SDK/ee/include -lgraph -lkernel
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
