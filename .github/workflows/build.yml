name: Build PS2 Compatible Image

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Proper ISO Structure
        run: |
          echo "Tworzę plik wykonywalny..."
          if [ -f "main.c" ]; then
              cp main.c SNAKE.ELF
          else
              touch SNAKE.ELF
          fi
          
          # Instalujemy narzędzia do tworzenia obrazów
          sudo apt-get update && sudo apt-get install -y genisoimage genisoimage
          
          mkdir -p iso_data
          cp SNAKE.ELF iso_data/MAIN.ELF
          
          # Tworzymy poprawny plik konfiguracyjny SYSTEM.CNF wielkich literach
          echo "BOOT2 = cdrom0:\MAIN.ELF;1" > iso_data/SYSTEM.CNF
          echo "VER = 1.00" >> iso_data/SYSTEM.CNF
          echo "VMODE = NTSC" >> iso_data/SYSTEM.CNF
          
          # Generujemy obraz ISO z pełnym wsparciem rozszerzeń Rock Ridge / Joliet
          genisoimage -J -R -V "SNAKE_GAME" -o SNAKE_FINAL.ISO iso_data/
          
          ls -la SNAKE_FINAL.ISO

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_FINAL.ISO
          path: SNAKE_FINAL.ISO
          
