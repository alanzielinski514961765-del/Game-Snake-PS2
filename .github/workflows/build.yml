name: Compile and Build PS2 Game

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source files
        run: |
          echo "Tworzę pliki źródłowe..."
          
          cat << 'EOF' > main.c
          #include <tamtypes.h>
          #include <kernel.h>
          int main() {
              while(1) {
                  SleepThread();
              }
              return 0;
          }
          EOF

          cat << 'EOF' > Makefile
          EE_BIN = SNAKE.ELF
          EE_OBJS = main.o
          all: $(EE_BIN)
          clean:
          	rm -f $(EE_BIN) $(EE_OBJS)
          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

      - name: Compile and Package ISO
        run: |
          echo "Instaluję genisoimage przez menedżer apk (Alpine)..."
          apk update && apk add genisoimage
          
          echo "Rozpoczynam kompilację MIPS..."
          make

          ls -la SNAKE.ELF
          
          mkdir -p iso_root
          cp SNAKE.ELF iso_root/BOOT.ELF
          
          echo "BOOT2 = cdrom0:\BOOT.ELF;1" > iso_root/SYSTEM.CNF
          echo "VER = 1.00" >> iso_root/SYSTEM.CNF
          echo "VMODE = NTSC" >> iso_root/SYSTEM.CNF
          
          genisoimage -iso-level 4 -joliet -rock -V "SNAKE_GAME" -o SNAKE_PLAYABLE.ISO iso_root/
          ls -la SNAKE_PLAYABLE.ISO

      - name: Upload Playable ISO
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PLAYABLE.ISO
          path: SNAKE_PLAYABLE.ISO
          
