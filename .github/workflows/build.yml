name: Build PS2 ISO Triple Threat

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Code with PS2SDK and Generate 3 ISO Variants
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          # Instalujemy wszystkie możliwe pakiety generujące obrazy ISO, żeby mieć 100% pewności
          apk update && apk add xorriso genisoimage cdrkit make
          
          # Kompilacja kodu za pomocą pełnego PS2SDK
          make
          
          # Tworzenie czystego katalogu roboczego
          mkdir -p iso_root
          cp BOOT.ELF iso_root/BOOT.ELF
          
          # Krytyczny plik konfiguracyjny SYSTEM.CNF z wielkimi literami i poprawną ścieżką
          printf "BOOT2 = cdrom0:\\\\BOOT.ELF;1\nVER = 1.00\nVMODE = NTSC\n" > iso_root/SYSTEM.CNF
          
          echo "=== WARIANT 1: Generowanie przez xorriso (tryb kompatybilny) ==="
          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_XORRISO.ISO iso_root/
          
          echo "=== WARIANT 2: Generowanie przez genisoimage (klasyczny tryb PS2) ==="
          genisoimage -iso-level 1 -o SNAKE_GENISO.ISO iso_root/
          
          echo "=== WARIANT 3: Generowanie przez mkisofs (starsza specyfikacja CD) ==="
          mkisofs -iso-level 1 -o SNAKE_MKISOFS.ISO iso_root/
          
          ls -la SNAKE_*.ISO

      - uses: actions/upload-artifact@v4
        with:
          name: PS2_SNAKE_ALL_VARIANTS
          path: SNAKE_*.ISO
          
