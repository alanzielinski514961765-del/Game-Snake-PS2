name: Build PS2 ISO Native

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Generate ISO natively
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          apk update && apk add xorriso make
          
          # Poprawiony kod gry Snake z pełną zgodnością z API draw.h i libpad.h
          cat << 'EOF' > main.c
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifcmd.h>
          #include <sifrpc.h>
          #include <graph.h>
          #include <draw.h>
          #include <libpad.h>

          #define SCREEN_WIDTH  640
          #define SCREEN_HEIGHT 448

          static char pad_buf[256] __attribute__((aligned(64)));

          int main(int argc, char *argv[]) {
              SifInitRpc(0);
              padInit(0);
              
              // Inicjalizacja trybu graficznego NTSC
              graph_set_mode(0, GRAPH_MODE_NTSC, GRAPH_MODE_INTERLACED, GRAPH_MODE_FIELD);
              
              // Alokacja bufora ramki
              framebuffer_t fb;
              fb.address = graph_vram_allocate(SCREEN_WIDTH, SCREEN_HEIGHT, GRAPH_PIXEL_32BIT, GRAPH_RAM_BLOCK);
              fb.width = SCREEN_WIDTH;
              fb.height = SCREEN_HEIGHT;
              fb.mask = 0;
              fb.psm = GRAPH_PIXEL_32BIT;
              graph_set_framebuffer(&fb);
              graph_enable_output();

              padPortOpen(0, 0, pad_buf);

              int score = 0;

              while(1) {
                  // Odczyt pada
                  struct padButtonStatus buttons;
                  if (padRead(0, 0, &buttons) > 0) {
                      u32 paddata = 0xffff ^ buttons.btns;
                      if (paddata & PAD_START) {
                          score += 10;
                      }
                  }

                  // Bezpieczne czyszczenie ekranu za pomocą oficjalnego API draw
                  qword_t q[256];
                  qword_t *q_ptr = q;
                  q_ptr = draw_clear(q_ptr, 0, 0.0f, 0.0f, SCREEN_WIDTH, SCREEN_HEIGHT, 0, 0, 0);
                  
                  // Przesłanie bufora do Graphic Synthesizer
                  draw_exec_packet(q, q_ptr - q);
                  draw_finish();

                  graph_wait_vsync();
              }
              return 0;
          }
          EOF

          # Makefile
          cat << 'EOF' > Makefile
          EE_BIN = SLES_555.55
          EE_OBJS = main.o
          EE_LIBS = -lpad -lgraph -ldraw -lkernel -lc
          
          all: $(EE_BIN)
          	mkdir -p iso_dir
          	cp $(EE_BIN) iso_dir/SLES_555.55
          	printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_dir/SYSTEM.CNF
          	xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_GAME.ISO iso_dir/

          clean:
          	rm -f $(EE_BIN) $(EE_OBJS) SNAKE_GAME.ISO
          	rm -rf iso_dir

          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

          make clean || true
          make
          
          ls -la SNAKE_GAME.ISO

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
