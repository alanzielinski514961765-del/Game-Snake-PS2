name: Build PS2 ISO Native

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobieranie toolchaina i kompilacja na czystym Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y wget make xorriso libarchive-tools build-essential git

          # Tworzymy katalog na narzędzia i pobieramy oficjalne prekompilowane SDK PS2
          mkdir -p /opt/ps2dev
          cd /opt/ps2dev
          
          echo "Pobieranie oficjalnego toolchaina..."
          wget -q https://github.com/ps2dev/ps2toolchain/releases/download/v1.0/ps2dev-ubuntu-latest.tar.gz -O ps2dev.tar.gz || true
          
          if [ -f ps2dev.tar.gz ] && [ -s ps2dev.tar.gz ]; then
              tar -xzf ps2dev.tar.gz
          else
              echo "Błąd pobierania paczki z toolchainem!"
              exit 1
          fi

          # Ustawienie ścieżek
          export PS2DEV=/opt/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PATH

          cd $GITHUB_WORKSPACE

          echo "Sprawdzanie dostępności ee-gcc:"
          which ee-gcc || find / -name "ee-gcc"

          # Kompilacja gry bezpośrednio z main.c
          ee-gcc -O2 main.c -o SLES_555.55 \
            -I$PS2SDK/ee/include \
            -I$PS2SDK/common/include \
            -L$PS2SDK/ee/lib \
            -lpad -lgraph -ldraw -lkernel -lc

          # Pakowanie do ISO
          mkdir -p iso_dir
          cp SLES_555.55 iso_dir/SLES_555.55
          printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_dir/SYSTEM.CNF
          
          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_GAME.ISO iso_dir/
          ls -la SNAKE_GAME.ISO

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
