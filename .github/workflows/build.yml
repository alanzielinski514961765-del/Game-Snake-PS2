name: Build PS2 ISO Native

on: [push]

env:
  PS2DEV: /usr/local/ps2dev
  PS2SDK: /usr/local/ps2dev/ps2sdk
  PATH: /usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Generate ISO natively
        run: |
          cat << 'EOF' > main.c
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifcmd.h>
          #include <sifrpc.h>
          #include <graph.h>
          #include <draw.h>
          #include <libpad.h>

          #define SCREEN_WIDTH  640
          #define SCREEN_HEIGHT 448
          #define BLOCK_SIZE    20

          typedef struct {
              int x, y;
          } Vector2;

          static char pad_buf[256] __attribute__((aligned(64)));

          int main(int argc, char *argv[]) {
              SifInitRpc(0);
              padInit(0);
              
              graph_set_mode(0, GRAPH_MODE_NTSC, GRAPH_MODE_INTERLACED, GRAPH_MODE_FIELD);
              
              qword_t packet[cache_align(128)];
              qword_t *q;

              padPortOpen(0, 0, pad_buf);

              // Inicjalizacja węża (rusza się sam w prawo)
              Vector2 snake[50];
              int snake_len = 3;
              snake[0] = (Vector2){16, 11};
              snake[1] = (Vector2){15, 11};
              snake[2] = (Vector2){14, 11};

              int dx = 1;
              int dy = 0;
              Vector2 apple = {20, 11};
              int frame_counter = 0;

              while(1) {
                  // Odczyt pada PS2 (sterowanie kierunkiem)
                  struct padButtonStatus buttons;
                  if (padRead(0, 0, &buttons) > 0) {
                      u32 paddata = 0xffff ^ buttons.btns;
                      if ((paddata & PAD_LEFT) && dx == 0) { dx = -1; dy = 0; }
                      else if ((paddata & PAD_RIGHT) && dx == 0) { dx = 1; dy = 0; }
                      else if ((paddata & PAD_UP) && dy == 0) { dx = 0; dy = -1; }
                      else if ((paddata & PAD_DOWN) && dy == 0) { dx = 0; dy = 1; }
                  }

                  // Logika ruchu węża (automatyczny ruch co kilkanaście klatek)
                  if (++frame_counter > 15) {
                      frame_counter = 0;
                      for (int i = snake_len - 1; i > 0; i--) {
                          snake[i] = snake[i - 1];
                      }
                      snake[0].x += dx;
                      snake[0].y += dy;

                      // Przechodzenie przez krawędzie ekranu
                      if (snake[0].x < 0) snake[0].x = (SCREEN_WIDTH / BLOCK_SIZE) - 1;
                      if (snake[0].x >= SCREEN_WIDTH / BLOCK_SIZE) snake[0].x = 0;
                      if (snake[0].y < 0) snake[0].y = (SCREEN_HEIGHT / BLOCK_SIZE) - 1;
                      if (snake[0].y >= SCREEN_HEIGHT / BLOCK_SIZE) snake[0].y = 0;

                      // Zjadanie jabłka i rośnięcie
                      if (snake[0].x == apple.x && snake[0].y == apple.y) {
                          if (snake_len < 50) snake_len++;
                          apple.x = (apple.x * 7 + 3) % (SCREEN_WIDTH / BLOCK_SIZE);
                          apple.y = (apple.y * 5 + 2) % (SCREEN_HEIGHT / BLOCK_SIZE);
                      }
                  }

                  // Renderowanie grafiki 2D (tło, jabłko, wąż)
                  q = packet;
                  q = draw_clear(q, 0, 0.0f, 0.0f, SCREEN_WIDTH, SCREEN_HEIGHT, 15, 15, 30);

                  // Rysowanie jabłka (czerwony kwadrat)
                  q = draw_rect(q, 0, 
                      (float)(apple.x * BLOCK_SIZE), (float)(apple.y * BLOCK_SIZE), 
                      (float)BLOCK_SIZE, (float)BLOCK_SIZE, 
                      255, 0, 0);

                  // Rysowanie węża (zielone kwadraty)
                  for (int i = 0; i < snake_len; i++) {
                      q = draw_rect(q, 0, 
                          (float)(snake[i].x * BLOCK_SIZE), (float)(snake[i].y * BLOCK_SIZE), 
                          (float)BLOCK_SIZE, (float)BLOCK_SIZE, 
                          0, 255, 0);
                  }

                  q = draw_finish(q);
                  draw_exec_packet(packet, q - packet);

                  graph_wait_vsync();
              }
              return 0;
          }
          EOF

          ee-gcc -O2 main.c -o SLES_555.55 -L$PS2SDK/ee/lib -lpad -lgraph -ldraw -lkernel -lc
          
          mkdir -p iso_dir
          cp SLES_555.55 iso_dir/SLES_555.55
          printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_dir/SYSTEM.CNF
          
          apk update && apk add xorriso
          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_GAME.ISO iso_dir/
          ls -la SNAKE_GAME.ISO

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
