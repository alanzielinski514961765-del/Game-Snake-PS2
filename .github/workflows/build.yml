name: Compile and Build PS2 Game

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # Używamy oficjalnego obrazu Dockera z gotowym PS2SDK i kompilatorem MIPS
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile C Code to PS2 ELF
        run: |
          echo "Rozpoczynam kompilację kodu pod architekturę PS2 MIPS..."
          
          # Jeśli nie ma pliku main.c, stwórzmy prosty działający kod Snake/Homebrew
          if [ ! -f "main.c" ]; then
              cat << 'EOF' > main.c
              #include <tamtypes.h>
              #include <kernel.h>
              int main() {
                  // Pętla główna programu homebrew
                  スタイ: while(1) {
                      SleepThread();
                  }
                  return 0;
              }
EOF
          fi

          # Tworzymy prosty Makefile dla PS2SDK, jeśli go nie ma
          if [ ! -f "Makefile" ]; then
              cat << 'EOF' > Makefile
              EE_BIN = SNAKE.ELF
              EE_OBJS = main.o
              all: $(EE_BIN)
              clean:
              	rm -f $(EE_BIN) $(EE_OBJS)
              include $(PS2SDK)/samples/Makefile.pref
              include $(PS2SDK)/samples/Makefile.eeglobal
EOF
          fi

          # Kompilujemy kod przy użyciu make i toolchaina PS2
          make

          # Sprawdzamy czy plik ELF powstał
          ls -la SNAKE.ELF
          
          # Instalujemy genisoimage do zrobienia ISO
          apt-get update && apt-get install -y genisoimage
          
          mkdir -p iso_root
          cp SNAKE.ELF iso_root/BOOT.ELF
          
          # Tworzymy SYSTEM.CNF
          echo "BOOT2 = cdrom0:\BOOT.ELF;1" > iso_root/SYSTEM.CNF
          echo "VER = 1.00" >> iso_root/SYSTEM.CNF
          echo "VMODE = NTSC" >> iso_root/SYSTEM.CNF
          
          # Generujemy ostateczne ISO
          genisoimage -iso-level 4 -joliet -rock -V "SNAKE_GAME" -o SNAKE_PLAYABLE.ISO iso_root/
          ls -la SNAKE_PLAYABLE.ISO

      - name: Upload Playable ISO
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PLAYABLE.ISO
          path: SNAKE_PLAYABLE.ISO
          
