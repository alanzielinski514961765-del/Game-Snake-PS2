name: Build PS2 Native ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps2-iso:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Pobranie kodu źródłowego
        uses: actions/checkout@v4

      - name: Kompilacja kodu i budowa ISO w kontenerze
        run: |
          echo "Szukam gdzie ukrył się ee-gcc..."
          find / -name "ee-gcc" 2>/dev/null
          
          # Ustawiamy ścieżki tam, gdzie faktycznie żyje ten kompilator w tym obrazie
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2EE/bin

          # Próbujemy znaleźć i odpalić kompilator bezpośrednio po pełnej ścieżce jeśli PATH zawiedzie
          EE_GCC=$(find / -name "ee-gcc" 2>/dev/null | head -n 1)
          if [ -z "$EE_GCC" ]; then
            echo "BŁĄD: Nie znaleziono ee-gcc w całym kontenerze!"
            exit 1
          fi
          
          echo "Znaleziono kompilator w: $EE_GCC"
          $EE_GCC --version

          echo "Kompilowanie projektu za pomocą Make..."
          make

          echo "Tworzenie struktury ISO dla PS2..."
          mkdir -p iso_root
          cp SLES_555.55 iso_root/SLES_555.55
          
          printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_root/SYSTEM.CNF

          apt-get update && apt-get install -y xorriso
          
          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_PS2.ISO iso_root/
          ls -lh SNAKE_PS2.ISO

      - name: Wrzuć gotowe ISO jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PS2.ISO
          path: SNAKE_PS2.ISO
          
