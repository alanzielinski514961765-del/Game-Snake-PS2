name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PS2 Toolchain & Build
        run: |
          # Instalujemy podstawowe pakiety
          sudo apt-get update && sudo apt-get install -y build-essential git wget cmake libgmp3-dev
          
          # Klonujemy i instalujemy oficjalne ps2dev w domyślnych ścieżkach
          git clone --depth 1 https://github.com/ps2dev/ps2dev.git /tmp/ps2dev
          cd /tmp/ps2dev
          
          # Eksportujemy zmienne środowiskowe, które są kluczowe dla Rules.make
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          # Wracamy do folderu projektu i uruchamiamy make z poprawnymi ścieżkami
          cd $GITHUB_WORKSPACE
          make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
