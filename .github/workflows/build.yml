name: Compile and Build PS2 Game

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source file
        run: |
          echo "Tworzę plik main.c..."
          cat << 'EOF' > main.c
          int main() {
              while(1) {
              }
              return 0;
          }
          EOF

      - name: Compile Direct and Package ISO
        shell: sh
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          echo "Instaluję cdrkit przez apk..."
          apk update && apk add cdrkit
          
          echo "Kompiluję czysty plik C na BOOT.ELF..."
          mips64r5900el-ps2-elf-gcc -O2 main.c -o BOOT.ELF -nostdlib
          
          ls -la BOOT.ELF
          
          # Przygotowujemy czysty katalog ISO
          mkdir -p iso_root
          cp BOOT.ELF iso_root/BOOT.ELF
          
          # SYSTEM.CNF z poprawnym wskazaniem na dysk optyczny
          printf "BOOT2 = cdrom0:\\BOOT.ELF;1\nVER = 1.00\nVMODE = NTSC\n" > iso_root/SYSTEM.CNF
          
          # Generujemy gotowy obraz ISO
          genisoimage -iso-level 1 -allow-lowercase -o SNAKE_PLAYABLE.ISO iso_root/
          ls -la SNAKE_PLAYABLE.ISO

      - name: Upload Playable ISO
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PLAYABLE.ISO
          path: SNAKE_PLAYABLE.ISO
          
