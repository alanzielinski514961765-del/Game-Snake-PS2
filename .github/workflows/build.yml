name: Build PS2 ISO Native

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and Generate ISO natively
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH="/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:$PATH"

          cat << 'EOF' > main.c
          #include <tamtypes.h>
          #include <kernel.h>
          #include <sifcmd.h>
          #include <sifrpc.h>
          #include <graph.h>
          #include <libpad.h>

          int main(int argc, char *argv[]) {
              SifInitRpc(0);
              padInit(0);
              graph_set_mode(0, GRAPH_MODE_NTSC, GRAPH_MODE_INTERLACED, GRAPH_MODE_FIELD);
              while(1) { graph_wait_vsync(); }
              return 0;
          }
          EOF

          ee-gcc -O2 main.c -o SLES_555.55 -L$PS2SDK/ee/lib -lpad -lgraph -ldraw -lkernel -lc
          
          mkdir -p iso_dir
          cp SLES_555.55 iso_dir/SLES_555.55
          printf "BOOT2 = cdrom0:\\\\SLES_555.55;1\nVER = 1.00\nVMODE = NTSC\n" > iso_dir/SYSTEM.CNF
          
          apt-get update && apt-get install -y xorriso
          xorriso -as mkisofs -iso-level 1 -full-iso9660-filenames -o SNAKE_GAME.ISO iso_dir/

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
