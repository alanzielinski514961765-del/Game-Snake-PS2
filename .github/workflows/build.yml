name: Build PS2 ISO Direct

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Package Direct
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          apk update && apk add xorriso
          
          # Tworzymy bezpośredni kod testowy w C dla PS2
          echo '#include <tamtypes.h>' > main.c
          echo '#include <kernel.h>' >> main.c
          echo 'int main() { while(1) {} return 0; }' >> main.c
          
          # Bezpośrednia kompilacja kompilatorem MIPS bez zewnętrznych reguł make
          mips64r5900el-ps2-elf-gcc -O2 main.c -o BOOT.ELF -nostdlib -Wl,-Ttext,0x198000
          
          mkdir -p iso_root
          cp BOOT.ELF iso_root/BOOT.ELF
          
          # Krytyczny SYSTEM.CNF z wielkimi literami
          printf "BOOT2 = cdrom0:\\\\BOOT.ELF;1\nVER = 1.00\nVMODE = NTSC\n" > iso_root/SYSTEM.CNF
          
          # Generowanie ISO przez xorriso
          xorriso -as mkisofs \
            -iso-level 1 \
            -full-iso9660-filenames \
            -o SNAKE_GAME.ISO \
            iso_root/
          
          ls -la SNAKE_GAME.ISO

      - uses: actions/upload-artifact@v4
        with:
          name: SNAKE_GAME.ISO
          path: SNAKE_GAME.ISO
          
