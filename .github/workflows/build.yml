name: Build PS2 Snake

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PS2dev toolchain and Compile
        run: |
          # Instalujemy podstawowe narzędzia budujące
          sudo apt-get update
          sudo apt-get install -y make wget git build-essential patch zlib1g-dev libgmp-dev libmpfr-dev libmpc-dev
          
          # Klonujemy oficjalne ps2sdk do /tmp/ps2sdk
          git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
          
          # Konfigurujemy zmienne środowiskowe, których wymaga Twój Makefile
          export PS2DEV=/tmp
          export PS2SDK=/tmp/ps2sdk
          
          # Uruchamiamy kompilację z Twojego Makefile
          make
          
          # Sprawdzamy czy plik SNAKE.ELF powstał
          if [ -f "SNAKE.ELF" ]; then
              echo "Sukces! SNAKE.ELF został skompilowany."
          else
              echo "Błąd: Plik ELF nie został utworzony."
              exit 1
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE.ELF
          path: SNAKE.ELF
          
