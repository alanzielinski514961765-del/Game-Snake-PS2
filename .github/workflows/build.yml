name: Compile and Build PS2 Game

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source file
        run: |
          echo "Tworzę plik main.c..."
          cat << 'EOF' > main.c
          #include <tamtypes.h>
          #include <kernel.h>
          int main() {
              while(1) {
                  SleepThread();
              }
              return 0;
          }
          EOF

      - name: Compile Direct and Package ISO
        shell: sh
        run: |
          # Ścieżki do środowiska PS2DEV
          export PS2DEV=/usr/local/ps2dev
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin
          
          echo "Instaluję cdrkit przez apk..."
          apk update && apk add cdrkit
          
          echo "Kompiluję bezpośrednio przez mips-ee-gcc..."
          # Bezpośrednia kompilacja pliku C na ELF dla PS2 z użyciem bibliotek SDK
          ee-gcc -O2 main.c -o SNAKE.ELF -lkernel
          
          ls -la SNAKE.ELF
          
          mkdir -p iso_root
          cp SNAKE.ELF iso_root/BOOT.ELF
          
          echo "BOOT2 = cdrom0:\BOOT.ELF;1" > iso_root/SYSTEM.CNF
          echo "VER = 1.00" > iso_root/SYSTEM.CNF
          echo "VMODE = NTSC" >> iso_root/SYSTEM.CNF
          
          genisoimage -iso-level 4 -joliet -rock -V "SNAKE_GAME" -o SNAKE_PLAYABLE.ISO iso_root/
          ls -la SNAKE_PLAYABLE.ISO

      - name: Upload Playable ISO
        uses: actions/upload-artifact@v4
        with:
          name: SNAKE_PLAYABLE.ISO
          path: SNAKE_PLAYABLE.ISO
          
